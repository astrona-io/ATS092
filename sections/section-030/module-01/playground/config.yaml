# Send Keycloak Events To Your Own Listener (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-092-playground-030-01"
  docs:
    guide: "docs/overview.md"
bootstrap:
  init:
    - name: "prepare"
      description: "Deploy Keycloak 26.8.1 with the provider and Maven volumes and the tester pod, create the realm inventory with the module's users and clients, and fill the Maven cache."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Starting workloads (namespace events-demo, keycloak-admin Secret, keycloak-providers and maven-cache PVCs, keycloak Deployment and Service, tester client)."
      type: "file"
      source: "manifests/lab-start.yaml"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - maven:3.9.15-eclipse-temurin-21
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
