# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats092-030
course_id: ATS092
exam_code: KEYCLOAK
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Event Listeners"
placement:
  position: after
  reading: sections/section-030/capstone/labs/lab-01/question.md
questions:
  - id: ats092-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Separate saving from listening"
    source_readings:
      - sections/section-030/module-01/course-01-user-events-and-admin-events.md
    prompt: "A realm has `eventsEnabled` set to `false`. What happens to its user events?"
    options:
      - id: a
        text: "The realm saves no events in the database, but its listeners still receive every event."
        explanation: "Correct. Saving and listening are separate."
      - id: b
        text: "No listener receives any event."
        explanation: "Not correct. Listeners receive events whether or not the realm saves them."
      - id: c
        text: "Keycloak saves the events and sends none to listeners."
        explanation: "Not correct. `false` turns off saving."
      - id: d
        text: "Only failed events are sent to listeners."
        explanation: "Not correct. Listeners receive successful and failed events."
    correct_option: a
    explanation: "Correct. Saving and listening are separate."

  - id: ats092-030-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a login is missing from the log"
    source_readings:
      - sections/section-030/module-01/course-01-user-events-and-admin-events.md
    prompt: "With only `jboss-logging` enabled, a successful sign-in leaves no line in the server log. Why?"
    options:
      - id: a
        text: "The `LOGIN` event is not sent for the password grant."
        explanation: "Not correct. `LOGIN` is sent for a token request such as the password grant."
      - id: b
        text: "Keycloak sends events only after a restart."
        explanation: "Not correct. Events are sent as they happen."
      - id: c
        text: "The realm `master` must save the event first."
        explanation: "Not correct. Saving is not needed for a listener."
      - id: d
        text: "`jboss-logging` writes successful events at `debug`, and the server prints only `info` and above."
        explanation: "Correct. The `LOGIN` event happened but did not reach the log."
    correct_option: d
    explanation: "Correct. The `LOGIN` event happened but did not reach the log."

  - id: ats092-030-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe an admin event"
    source_readings:
      - sections/section-030/module-01/course-01-user-events-and-admin-events.md
    prompt: "Which fields describe an admin event?"
    options:
      - id: a
        text: "An event type such as `LOGIN` and a client id."
        explanation: "Not correct. That describes a user event."
      - id: b
        text: "A theme name and a message key."
        explanation: "Not correct. These belong to themes."
      - id: c
        text: "An operation type, a resource type and a resource path."
        explanation: "Correct. For example `CREATE`, `USER` and `users/<id>`."
      - id: d
        text: "A flow alias and a requirement."
        explanation: "Not correct. These belong to authentication flows."
    correct_option: c
    explanation: "Correct. For example `CREATE`, `USER` and `users/<id>`."

  - id: ats092-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Test a LOGIN listener"
    source_readings:
      - sections/section-030/module-01/course-02-writing-an-event-listener.md
    prompt: "You test a listener that handles only `LOGIN` by signing in with a wrong password. It writes nothing. Why?"
    options:
      - id: a
        text: "The listener is not loaded."
        explanation: "Not correct. A loaded listener still ignores other event types."
      - id: b
        text: "A wrong password sends `LOGIN_ERROR`, not `LOGIN`."
        explanation: "Correct. Test a `LOGIN` listener with a successful sign-in."
      - id: c
        text: "Keycloak sends no event for a wrong password."
        explanation: "Not correct. It sends `LOGIN_ERROR`."
      - id: d
        text: "Listeners receive only admin events."
        explanation: "Not correct. Listeners receive user events too."
    correct_option: b
    explanation: "Correct. Test a `LOGIN` listener with a successful sign-in."

  - id: ats092-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Look up names in a listener"
    source_readings:
      - sections/section-030/module-01/course-02-writing-an-event-listener.md
    prompt: "A `LOGIN` event holds the realm id and the user id. How does the listener write the user's name?"
    options:
      - id: a
        text: "It looks the user up with `session.users().getUserById(realm, id)`."
        explanation: "Correct. The listener uses the `KeycloakSession` from its factory."
      - id: b
        text: "It reads the name from the services file."
        explanation: "Not correct. The services file only names the factory class."
      - id: c
        text: "It asks the client to send the name again."
        explanation: "Not correct. A listener cannot ask the client."
      - id: d
        text: "It uses the id in the log line because names are never available."
        explanation: "Not correct. Names are available through the session."
    correct_option: a
    explanation: "Correct. The listener uses the `KeycloakSession` from its factory."

  - id: ats092-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the role of the factory id"
    source_readings:
      - sections/section-030/module-01/course-02-writing-an-event-listener.md
    prompt: "What is the id returned by an event listener factory's `getId()` used for?"
    options:
      - id: a
        text: "It is the name of the Maven JAR."
        explanation: "Not correct. The JAR name comes from the `pom.xml`."
      - id: b
        text: "It is the log level of the listener."
        explanation: "Not correct. The listener chooses its level in code."
      - id: c
        text: "It is the name of the services file."
        explanation: "Not correct. The file is named after the factory interface."
      - id: d
        text: "It is the name a realm puts in its `eventsListeners` list."
        explanation: "Correct. Here it is `audit-log`."
    correct_option: d
    explanation: "Correct. Here it is `audit-log`."

  - id: ats092-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain a loaded but silent listener"
    source_readings:
      - sections/section-030/module-01/course-03-enabling-a-listener-in-a-realm.md
    prompt: "Keycloak lists `audit-log` in the server info, but a sign-in writes no `AUDIT-LOG` line. What is missing?"
    options:
      - id: a
        text: "A restart of the pod after the build."
        explanation: "Not correct. Keycloak already loaded the listener."
      - id: b
        text: "A second JAR with the same listener."
        explanation: "Not correct. One loaded copy is enough."
      - id: c
        text: "The realm's `eventsListeners` list does not contain `audit-log`."
        explanation: "Correct. Each realm chooses its own listeners."
      - id: d
        text: "A theme for the realm."
        explanation: "Not correct. Themes do not affect events."
    correct_option: c
    explanation: "Correct. Each realm chooses its own listeners."

  - id: ats092-030-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Keep the built-in listener"
    source_readings:
      - sections/section-030/module-01/course-03-enabling-a-listener-in-a-realm.md
    prompt: "You set `eventsListeners` to only `audit-log`. What is the effect?"
    options:
      - id: a
        text: "Keycloak adds `audit-log` and keeps `jboss-logging`."
        explanation: "Not correct. Setting the list replaces it."
      - id: b
        text: "The list is replaced, so `jboss-logging` is gone and failed sign-ins are no longer logged as warnings."
        explanation: "Correct. Write every listener the realm should keep."
      - id: c
        text: "Keycloak refuses the change."
        explanation: "Not correct. It accepts a list with one entry."
      - id: d
        text: "Only admin events are sent to the realm."
        explanation: "Not correct. User events are still sent to the listed listeners."
    correct_option: b
    explanation: "Correct. Write every listener the realm should keep."

  - id: ats092-030-q09
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what needs a restart"
    source_readings:
      - sections/section-030/module-01/course-03-enabling-a-listener-in-a-realm.md
    prompt: "What needs a restart of Keycloak?"
    options:
      - id: a
        text: "A new listener JAR in the providers directory."
        explanation: "Correct. Keycloak reads JARs only when it starts."
      - id: b
        text: "Changing a realm's `eventsListeners` list."
        explanation: "Not correct. This is realm data and applies from the next event."
      - id: c
        text: "Turning on `adminEventsEnabled`."
        explanation: "Not correct. This is realm data too."
      - id: d
        text: "Creating a user with `kcadm`."
        explanation: "Not correct. This needs no restart."
    correct_option: a
    explanation: "Correct. Keycloak reads JARs only when it starts."

  - id: ats092-030-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Find the realm of an admin event"
    source_readings:
      - sections/section-030/module-01/course-03-enabling-a-listener-in-a-realm.md
    prompt: "An administrator signed in to the realm `master` creates a user in the realm `inventory`. To which realm does the admin event belong?"
    options:
      - id: a
        text: "`master`, the realm the administrator signed in to."
        explanation: "Not correct. The event belongs to the changed realm."
      - id: b
        text: "Both realms get a copy of the event."
        explanation: "Not correct. Only the changed realm gets it."
      - id: c
        text: "None, because admin events have no realm."
        explanation: "Not correct. An admin event always has a realm."
      - id: d
        text: "`inventory`, the realm that was changed."
        explanation: "Correct. The audit line shows `realm=inventory`."
    correct_option: d
    explanation: "Correct. The audit line shows `realm=inventory`."

  - id: ats092-030-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Failure reason"
    source_readings:
      - sections/section-030/module-01/course-04-event-types-and-details.md
    prompt: "Where does a listener find the reason of a failed sign-in?"
    options:
      - id: a
        text: "In `event.getError()`."
        explanation: "Correct. The error field holds a code such as `invalid_user_credentials`."
      - id: b
        text: "In `event.getType()`."
        explanation: "Not correct. The type is `LOGIN_ERROR`."
      - id: c
        text: "In `event.getTime()`."
        explanation: "Not correct. This is the time."
      - id: d
        text: "In `event.getRealmId()`."
        explanation: "Not correct. This is the realm id."
    correct_option: a
    explanation: "Correct. The error field is set only on error events."

  - id: ats092-030-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Unknown user"
    source_readings:
      - sections/section-030/module-01/course-04-event-types-and-details.md
    prompt: "Why can `event.getUserId()` be `null` for `LOGIN_ERROR`?"
    options:
      - id: a
        text: "The user name may not exist, so there is no user."
        explanation: "Correct. The name is then in the details."
      - id: b
        text: "Keycloak removes user ids from error events."
        explanation: "Not correct. Keycloak does not remove them."
      - id: c
        text: "User ids are only stored for admin events."
        explanation: "Not correct. User events have user ids."
      - id: d
        text: "It is always `null`."
        explanation: "Not correct. It is set for a known user."
    correct_option: a
    explanation: "Correct. A failed sign-in for an unknown name has no user id."

  - id: ats092-030-q13
    type: single_choice
    difficulty: advanced
    learning_objective: "Listener exception"
    source_readings:
      - sections/section-030/module-01/course-05-failures-and-transactions.md
    prompt: "A listener throws an exception while a user signs in. What happens?"
    options:
      - id: a
        text: "Keycloak logs an error and the sign-in continues."
        explanation: "Correct. A listener cannot cancel the request."
      - id: b
        text: "The sign-in fails."
        explanation: "Not correct. The request is not cancelled."
      - id: c
        text: "Keycloak removes the listener from the realm."
        explanation: "Not correct. The realm settings do not change."
      - id: d
        text: "Keycloak restarts."
        explanation: "Not correct. The server keeps running."
    correct_option: a
    explanation: "Correct. A listener failure is quiet and only visible in the log."

  - id: ats092-030-q14
    type: single_choice
    difficulty: advanced
    learning_objective: "After commit"
    source_readings:
      - sections/section-030/module-01/course-05-failures-and-transactions.md
    prompt: "How can a listener act only after the surrounding change is saved?"
    options:
      - id: a
        text: "It enlists an `EventListenerTransaction` with `enlistAfterCompletion`."
        explanation: "Correct. The step runs after the transaction completes."
      - id: b
        text: "It calls `Thread.sleep`."
        explanation: "Not correct. This delays the request."
      - id: c
        text: "It writes to the log twice."
        explanation: "Not correct. This does not wait for a commit."
      - id: d
        text: "It cannot, because events are sent after the commit."
        explanation: "Not correct. A listener may run before the commit."
    correct_option: a
    explanation: "Correct. Use a transaction step for effects that are hard to undo."

  - id: ats092-030-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Separate storing from listening"
    source_readings:
      - sections/section-030/module-02/course-01-what-the-event-store-holds.md
    prompt: "Which field of the event configuration makes a realm save user events in its database?"
    options:
      - id: a
        text: "`eventsListeners`"
        explanation: "Not correct. It lists the listeners that receive events."
      - id: b
        text: "`eventsEnabled`"
        explanation: "Correct. It turns on storing of user events."
      - id: c
        text: "`adminEventsDetailsEnabled`"
        explanation: "Not correct. It adds the representation to admin events."
      - id: d
        text: "`eventsExpiration`"
        explanation: "Not correct. It sets how long stored events live."
    correct_option: b
    explanation: "Correct. `eventsEnabled` stores user events; listeners are a separate setting."

  - id: ats092-030-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the two stores"
    source_readings:
      - sections/section-030/module-02/course-01-what-the-event-store-holds.md
    prompt: "A realm has `adminEventsEnabled` set to `true` and `eventsEnabled` set to `false`. What does it store?"
    options:
      - id: a
        text: "Only admin events."
        explanation: "Correct. Each kind has its own switch."
      - id: b
        text: "Nothing, because both fields must be true."
        explanation: "Not correct. The fields are independent."
      - id: c
        text: "Only user events."
        explanation: "Not correct. User events need `eventsEnabled`."
      - id: d
        text: "Both kinds, because one field is enough."
        explanation: "Not correct. Each kind needs its own field."
    correct_option: a
    explanation: "Correct. User events and admin events are stored separately."

  - id: ats092-030-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the effect of a list update"
    source_readings:
      - sections/section-030/module-02/course-02-choosing-what-to-store.md
    prompt: "A realm stores `LOGIN` and `LOGIN_ERROR`. You run `kcadm update events/config -r inventory -s 'enabledEventTypes=[\"LOGIN_ERROR\"]'`. What does the realm store afterwards?"
    options:
      - id: a
        text: "`LOGIN` and `LOGIN_ERROR`, because the update adds to the list."
        explanation: "Not correct. The update does not add to the list."
      - id: b
        text: "Only `LOGIN`."
        explanation: "Not correct. `LOGIN` is not in the new list."
      - id: c
        text: "Only `LOGIN_ERROR`."
        explanation: "Correct. The new list replaces the old one."
      - id: d
        text: "Nothing, because the list must hold two types."
        explanation: "Not correct. A list can hold one type."
    correct_option: c
    explanation: "Correct. `enabledEventTypes` is replaced, so name every type to keep."

  - id: ats092-030-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the setting for the representation"
    source_readings:
      - sections/section-030/module-02/course-02-choosing-what-to-store.md
    prompt: "Which field makes Keycloak save the JSON of the changed object with each admin event?"
    options:
      - id: a
        text: "`adminEventsEnabled`"
        explanation: "Not correct. It saves the event without the representation."
      - id: b
        text: "`eventsEnabled`"
        explanation: "Not correct. It concerns user events."
      - id: c
        text: "`enabledEventTypes`"
        explanation: "Not correct. It lists user event types."
      - id: d
        text: "`adminEventsDetailsEnabled`"
        explanation: "Correct. It adds the representation to stored admin events."
    correct_option: d
    explanation: "Correct. Details are a separate switch because the representation can hold personal data."

  - id: ats092-030-q19
    type: single_choice
    difficulty: beginner
    learning_objective: "Know when events are saved"
    source_readings:
      - sections/section-030/module-02/course-01-what-the-event-store-holds.md
    prompt: "You turn `eventsEnabled` on at noon. A user signed in at 11:00. Does the store hold that sign-in?"
    options:
      - id: a
        text: "No. Only events after the change are saved."
        explanation: "Correct. The store never saves events from before the change."
      - id: b
        text: "Yes. Keycloak copies the earlier events from the log."
        explanation: "Not correct. Keycloak does not read the log."
      - id: c
        text: "Yes, but only for `LOGIN_ERROR`."
        explanation: "Not correct. Nothing from before the change is saved."
      - id: d
        text: "Yes, after a restart."
        explanation: "Not correct. A restart does not recover events."
    correct_option: a
    explanation: "Correct. The store holds only events that happen after the setting is on."

  - id: ats092-030-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Filter by user"
    source_readings:
      - sections/section-030/module-02/course-03-querying-stored-events.md
    prompt: "Which value does the `user` filter of the `events` path take?"
    options:
      - id: a
        text: "The user name, such as `alice`."
        explanation: "Not correct. The filter does not take a name."
      - id: b
        text: "The email address of the user."
        explanation: "Not correct. The filter does not take an email address."
      - id: c
        text: "The id of the user."
        explanation: "Correct. Read the id first, for example with `kcadm get users`."
      - id: d
        text: "The client id."
        explanation: "Not correct. Use the `client` filter for that."
    correct_option: c
    explanation: "Correct. The `user` filter takes the id of the user."

  - id: ats092-030-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find a failed sign-in"
    source_readings:
      - sections/section-030/module-02/course-03-querying-stored-events.md
    prompt: "Which command lists the stored failed sign-ins of the realm `inventory`?"
    options:
      - id: a
        text: "`kcadm get events -r inventory -q type=LOGIN_ERROR`"
        explanation: "Correct. A failed sign-in is the type `LOGIN_ERROR`."
      - id: b
        text: "`kcadm get events -r inventory -q error=true`"
        explanation: "Not correct. There is no `error` filter."
      - id: c
        text: "`kcadm get admin-events -r inventory -q type=LOGIN`"
        explanation: "Not correct. Admin events are changes, not sign-ins."
      - id: d
        text: "`kcadm get events/config -r inventory`"
        explanation: "Not correct. That reads the configuration."
    correct_option: a
    explanation: "Correct. Use the `events` path with the type filter."

  - id: ats092-030-q22
    type: single_choice
    difficulty: advanced
    learning_objective: "Read the realm ids of an admin event"
    source_readings:
      - sections/section-030/module-02/course-03-querying-stored-events.md
    prompt: "An administrator signs in to the realm `master` and changes a client in the realm `inventory`. Which realm does the `realmId` of the stored admin event name?"
    options:
      - id: a
        text: "`master`, the realm of the administrator."
        explanation: "Not correct. That one is in `authDetails.realmId`."
      - id: b
        text: "`inventory`, the realm that changed."
        explanation: "Correct. The event belongs to the realm that was changed."
      - id: c
        text: "Both, as a list."
        explanation: "Not correct. The field holds one id."
      - id: d
        text: "Neither. The field is always empty."
        explanation: "Not correct. The field is set."
    correct_option: b
    explanation: "Correct. `realmId` is the changed realm, and `authDetails` describes the caller."

  - id: ats092-030-q23
    type: single_choice
    difficulty: beginner
    learning_objective: "Use the unit of the expiration"
    source_readings:
      - sections/section-030/module-02/course-04-expiring-and-clearing-events.md
    prompt: "You want stored user events to live for one day. Which value do you give `eventsExpiration`?"
    options:
      - id: a
        text: "`1`"
        explanation: "Not correct. The value is not in days."
      - id: b
        text: "`24`"
        explanation: "Not correct. The value is not in hours."
      - id: c
        text: "`1440`"
        explanation: "Not correct. The value is not in minutes."
      - id: d
        text: "`86400`"
        explanation: "Correct. The value is in seconds."
    correct_option: d
    explanation: "Correct. `eventsExpiration` is a number of seconds."

  - id: ats092-030-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what deleting events removes"
    source_readings:
      - sections/section-030/module-02/course-04-expiring-and-clearing-events.md
    prompt: "You run `kcadm delete events -r inventory`. What happens?"
    options:
      - id: a
        text: "All stored user events of the realm are removed, and the server log is unchanged."
        explanation: "Correct. The request has no filter and does not touch the log."
      - id: b
        text: "Only events older than `eventsExpiration` are removed."
        explanation: "Not correct. The request removes all stored user events."
      - id: c
        text: "Events and the log lines of `jboss-logging` are removed."
        explanation: "Not correct. The log is not part of the store."
      - id: d
        text: "The realm stops storing events."
        explanation: "Not correct. The settings stay as they are."
    correct_option: a
    explanation: "Correct. The store is emptied; logs and settings are not changed."
