# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats092-010
course_id: ATS092
exam_code: KEYCLOAK
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Service Provider Interfaces"
placement:
  position: after
  reading: sections/section-010/capstone/labs/lab-01/question.md
questions:
  - id: ats092-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Define an SPI and a provider"
    source_readings:
      - sections/section-010/module-01/course-01-what-an-spi-is.md
    prompt: "What is a provider in Keycloak?"
    options:
      - id: a
        text: "One implementation of a Java interface that Keycloak defines for one kind of extension."
        explanation: "Correct. The interface is the SPI, and each implementation of it is a provider."
      - id: b
        text: "A Maven project that contains a `pom.xml` and nothing else."
        explanation: "Not correct. A Maven project is only how a provider is built."
      - id: c
        text: "A pod in the Keycloak namespace that serves one realm."
        explanation: "Not correct. A provider is Java code loaded into Keycloak, not a pod."
      - id: d
        text: "A setting in a realm that turns a feature on."
        explanation: "Not correct. A realm setting can select a provider but is not one."
    correct_option: a
    explanation: "Correct. The interface is the SPI, and each implementation of it is a provider."

  - id: ats092-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "List the providers Keycloak loaded"
    source_readings:
      - sections/section-010/module-01/course-01-what-an-spi-is.md
    prompt: "Which command shows every SPI and provider that a running Keycloak loaded?"
    options:
      - id: a
        text: "`kubectl get providers`"
        explanation: "Not correct. Kubernetes has no resource called providers for Keycloak."
      - id: b
        text: "`kcadm get realms`"
        explanation: "Not correct. This lists realms, not loaded providers."
      - id: c
        text: "`ls /opt/keycloak/bin`"
        explanation: "Not correct. This lists the tools, not the loaded providers."
      - id: d
        text: "`kcadm get serverinfo`"
        explanation: "Correct. The Admin REST API path `serverinfo` reports all SPIs and providers."
    correct_option: d
    explanation: "Correct. The Admin REST API path `serverinfo` reports all SPIs and providers."

  - id: ats092-010-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell the life of a factory from the life of a provider"
    source_readings:
      - sections/section-010/module-01/course-01-what-an-spi-is.md
    prompt: "How often does Keycloak create the provider factory and the provider?"
    options:
      - id: a
        text: "The factory for every request; the provider once at start."
        explanation: "Not correct. This reverses the two lives."
      - id: b
        text: "Both once at start, and both are shared by every request."
        explanation: "Not correct. The provider is created per request."
      - id: c
        text: "The factory once at start; the provider from the factory's `create()`, usually once per request."
        explanation: "Correct. The factory lives as long as the server and creates a provider for each request."
      - id: d
        text: "Both for every request, and both closed when the request ends."
        explanation: "Not correct. The factory stays until the server shuts down."
    correct_option: c
    explanation: "Correct. The factory lives as long as the server and creates a provider for each request."

  - id: ats092-010-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place the KeycloakSession correctly"
    source_readings:
      - sections/section-010/module-01/course-01-what-an-spi-is.md
    prompt: "A developer stores the `KeycloakSession` in a field of the factory. What is wrong with that?"
    options:
      - id: a
        text: "Nothing. The session is created once at start and shared."
        explanation: "Not correct. A new session is created for each request."
      - id: b
        text: "A session lives only as long as its request, so the factory must not keep it."
        explanation: "Correct. The provider keeps the session for one request; the factory outlives it."
      - id: c
        text: "Sessions can only be read in the Admin Console."
        explanation: "Not correct. Providers use the session in every request."
      - id: d
        text: "The factory cannot have fields in Java."
        explanation: "Not correct. A factory may have fields; the problem is the session's lifetime."
    correct_option: b
    explanation: "Correct. The provider keeps the session for one request; the factory outlives it."

  - id: ats092-010-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how Keycloak finds a factory"
    source_readings:
      - sections/section-010/module-01/course-01-what-an-spi-is.md
    prompt: "How does Keycloak find the factory classes in a provider JAR?"
    options:
      - id: a
        text: "With Java's `ServiceLoader`, which reads files under `META-INF/services/` in the JAR."
        explanation: "Correct. Keycloak does not scan the JAR for classes."
      - id: b
        text: "It scans every class in the JAR for the word Factory."
        explanation: "Not correct. Keycloak does not scan classes."
      - id: c
        text: "It reads the class names from the `pom.xml`."
        explanation: "Not correct. The `pom.xml` is only used at build time."
      - id: d
        text: "It reads the factory name from the realm settings."
        explanation: "Not correct. Realm settings come after the factory is loaded."
    correct_option: a
    explanation: "Correct. Keycloak does not scan the JAR for classes."

  - id: ats092-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the services file correctly"
    source_readings:
      - sections/section-010/module-01/course-02-writing-a-provider-and-its-factory.md
    prompt: "What is the correct name of the services file for a realm resource provider?"
    options:
      - id: a
        text: "`META-INF/services/org.keycloak.services.resource.RealmResourceProvider`"
        explanation: "Not correct. This names the provider interface and is ignored without a message."
      - id: b
        text: "`META-INF/services/inventory-status`"
        explanation: "Not correct. The file is named after an interface, not the provider id."
      - id: c
        text: "`META-INF/beans.xml`"
        explanation: "Not correct. `beans.xml` is an empty file for the web layer, not the registration."
      - id: d
        text: "`META-INF/services/org.keycloak.services.resource.RealmResourceProviderFactory`"
        explanation: "Correct. The file is named after the factory interface."
    correct_option: d
    explanation: "Correct. The file is named after the factory interface."

  - id: ats092-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the provided scope"
    source_readings:
      - sections/section-010/module-01/course-02-writing-a-provider-and-its-factory.md
    prompt: "Why do the Keycloak dependencies in the `pom.xml` use the scope `provided`?"
    options:
      - id: a
        text: "It makes Maven download the dependencies faster."
        explanation: "Not correct. The scope does not change download speed."
      - id: b
        text: "It makes Keycloak update the dependencies by itself."
        explanation: "Not correct. Keycloak never changes the JAR's dependencies."
      - id: c
        text: "Maven compiles against them but does not pack them into the JAR, because Keycloak has them at runtime."
        explanation: "Correct. A second copy of Keycloak classes in the JAR would cause class conflicts."
      - id: d
        text: "It lets the JAR run on any Keycloak version."
        explanation: "Not correct. The SPIs are internal, and the version must match the server."
    correct_option: c
    explanation: "Correct. A second copy of Keycloak classes in the JAR would cause class conflicts."

  - id: ats092-010-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a provider that is missing with a clean log"
    source_readings:
      - sections/section-010/module-01/course-03-loading-providers.md
    prompt: "The build Job succeeded, the JAR is in the providers directory, Keycloak was restarted and starts without an error, but the endpoint answers `404`. What is the most likely cause?"
    options:
      - id: a
        text: "The services file names a class that does not exist."
        explanation: "Not correct. That makes the build at start fail, and the pod restarts again and again."
      - id: b
        text: "The services file has the wrong name, so `ServiceLoader` never opened it."
        explanation: "Correct. A misnamed file gives no error; the provider id is just missing from the server info."
      - id: c
        text: "The `tester` pod has no network access."
        explanation: "Not correct. A blocked network gives a connection error, not a `404` from Keycloak."
      - id: d
        text: "Keycloak must be started with `--optimized` to load JARs."
        explanation: "Not correct. `--optimized` skips the build and would not load a new JAR."
    correct_option: b
    explanation: "Correct. A misnamed file gives no error; the provider id is just missing from the server info."

  - id: ats092-010-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Read the log of a crashed Keycloak container"
    source_readings:
      - sections/section-010/module-01/course-03-loading-providers.md
    prompt: "A services file names a class that does not exist. Keycloak restarts again and again. Which command shows the error of the container that crashed?"
    options:
      - id: a
        text: "`kubectl -n spi-demo logs deploy/keycloak --previous`"
        explanation: "Correct. `--previous` shows the log of the container that failed."
      - id: b
        text: "`kubectl -n spi-demo logs deploy/keycloak` after the new container started"
        explanation: "Not correct. This shows the container that is starting now, not the one that crashed."
      - id: c
        text: "`kcadm get serverinfo`"
        explanation: "Not correct. The server is not running, so it cannot answer."
      - id: d
        text: "`kubectl -n spi-demo get configmap provider-source`"
        explanation: "Not correct. This shows the source, not the crash error."
    correct_option: a
    explanation: "Correct. `--previous` shows the log of the container that failed."

  - id: ats092-010-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Load providers in production"
    source_readings:
      - sections/section-010/module-01/course-03-loading-providers.md
    prompt: "A production server starts with `--optimized`. How does a changed provider JAR get loaded?"
    options:
      - id: a
        text: "Restart the pod; the restart reads the providers directory."
        explanation: "Not correct. An optimized server does not build at start."
      - id: b
        text: "Send a request to `/realms/master/reload`."
        explanation: "Not correct. Keycloak has no such reload endpoint for providers."
      - id: c
        text: "Change the realm's `loginTheme` setting."
        explanation: "Not correct. Realm settings do not load JARs."
      - id: d
        text: "Build a new image that runs `kc.sh build` with the JAR in the providers directory."
        explanation: "Correct. With `--optimized` the build at start is skipped, so only a new build loads providers."
    correct_option: d
    explanation: "Correct. With `--optimized` the build at start is skipped, so only a new build loads providers."

  - id: ats092-010-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order the factory methods"
    source_readings:
      - sections/section-010/module-01/course-04-provider-lifecycle-and-keycloaksession.md
    prompt: "In which order does Keycloak call the methods of a provider factory at server start?"
    options:
      - id: a
        text: "`init`, then `postInit`, and `create` when a provider is needed."
        explanation: "Correct. The factory is configured first and used afterwards."
      - id: b
        text: "`create`, then `init`, then `postInit`."
        explanation: "Not correct. `create` needs a configured factory."
      - id: c
        text: "`postInit`, then `init`."
        explanation: "Not correct. `init` runs first."
      - id: d
        text: "`close`, then `init`."
        explanation: "Not correct. `close` runs when the server stops."
    correct_option: a
    explanation: "Correct. `init` and `postInit` run once at start, and `create` runs per session."

  - id: ats092-010-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "State kept in a factory"
    source_readings:
      - sections/section-010/module-01/course-04-provider-lifecycle-and-keycloaksession.md
    prompt: "Why must a factory not keep data that belongs to one request?"
    options:
      - id: a
        text: "The factory is created once and shared by every request."
        explanation: "Correct. Data of one request would leak into another."
      - id: b
        text: "The factory is deleted after each request."
        explanation: "Not correct. The factory lives until the server stops."
      - id: c
        text: "A factory cannot have fields."
        explanation: "Not correct. A factory can have fields."
      - id: d
        text: "Keycloak copies the factory for each user."
        explanation: "Not correct. Keycloak creates one factory instance."
    correct_option: a
    explanation: "Correct. One factory instance serves all requests."

  - id: ats092-010-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Dependency scope"
    source_readings:
      - sections/section-010/module-01/course-05-dependencies-and-packaging.md
    prompt: "Which Maven scope should the Keycloak artifacts have in a provider project?"
    options:
      - id: a
        text: "`provided`"
        explanation: "Correct. The server already contains these classes."
      - id: b
        text: "`compile`, so they are packed into the JAR."
        explanation: "Not correct. This can clash with the classes of the server."
      - id: c
        text: "`test`"
        explanation: "Not correct. The classes are needed to compile the main code."
      - id: d
        text: "`runtime`"
        explanation: "Not correct. They are needed at compile time as well."
    correct_option: a
    explanation: "Correct. The classes exist in the running server, so they are not packed."

  - id: ats092-010-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Third-party library"
    source_readings:
      - sections/section-010/module-01/course-05-dependencies-and-packaging.md
    prompt: "Your provider uses a library that Keycloak does not ship. What must you do?"
    options:
      - id: a
        text: "Put the library in the JAR, for example with the Maven Shade plugin, or add its JAR to the providers directory."
        explanation: "Correct. The library must be on the server's classpath at runtime."
      - id: b
        text: "Nothing, because Keycloak downloads it."
        explanation: "Not correct. Keycloak does not download dependencies."
      - id: c
        text: "Add it with `provided` scope."
        explanation: "Not correct. A provided library is not packed."
      - id: d
        text: "Rename the library JAR to `.zip`."
        explanation: "Not correct. The extension does not matter here."
    correct_option: a
    explanation: "Correct. A missing runtime library gives a `ClassNotFoundException`."

  - id: ats092-010-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Name a provider setting"
    source_readings:
      - sections/section-010/module-02/course-01-where-provider-settings-come-from.md
    prompt: "Which environment variable sets the key `mode` of the provider `inventory-status` of the SPI `realm-restapi-extension`?"
    options:
      - id: a
        text: "`KC_SPI_REALM_RESTAPI_EXTENSION_INVENTORY_STATUS_MODE`"
        explanation: "Not correct. The parts must be separated by two underscores."
      - id: b
        text: "`KC_REALM_RESTAPI_EXTENSION__INVENTORY_STATUS__MODE`"
        explanation: "Not correct. The name must start with `KC_SPI_`."
      - id: c
        text: "`KC_SPI_REALM_RESTAPI_EXTENSION__INVENTORY_STATUS__MODE`"
        explanation: "Correct. The three parts are separated by two underscores."
      - id: d
        text: "`SPI_INVENTORY_STATUS_MODE`"
        explanation: "Not correct. The name must start with `KC_SPI_` and include the SPI."
    correct_option: c
    explanation: "Correct. Prefix, upper case, underscores inside parts, two underscores between parts."

  - id: ats092-010-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Source order"
    source_readings:
      - sections/section-010/module-02/course-01-where-provider-settings-come-from.md
    prompt: "Which source of a setting wins when the command line, the environment and `keycloak.conf` all set it?"
    options:
      - id: a
        text: "The command line."
        explanation: "Correct. Keycloak reads the command line first."
      - id: b
        text: "`keycloak.conf`."
        explanation: "Not correct. The file has the lowest priority."
      - id: c
        text: "The environment."
        explanation: "Not correct. The command line beats the environment."
      - id: d
        text: "The last one Keycloak finds on disk."
        explanation: "Not correct. The order is fixed."
    correct_option: a
    explanation: "Correct. Command line, then environment, then file."

  - id: ats092-010-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Unknown setting names"
    source_readings:
      - sections/section-010/module-02/course-01-where-provider-settings-come-from.md
    prompt: "A setting name matches no provider. What does Keycloak do?"
    options:
      - id: a
        text: "It stops with an error at start."
        explanation: "Not correct. It does not validate names."
      - id: b
        text: "It disables the provider."
        explanation: "Not correct. The provider stays enabled."
      - id: c
        text: "It writes the setting to the database."
        explanation: "Not correct. Settings are not stored."
      - id: d
        text: "It ignores the setting and the provider keeps its default."
        explanation: "Correct. Nothing reads the value."
    correct_option: d
    explanation: "Correct. A wrong name has no visible error."

  - id: ats092-010-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a setting"
    source_readings:
      - sections/section-010/module-02/course-02-reading-settings-in-a-factory.md
    prompt: "In which factory method should a provider read its settings?"
    options:
      - id: a
        text: "`create`, for every request."
        explanation: "Not correct. `create` runs for each session."
      - id: b
        text: "`init`, once at start."
        explanation: "Correct. `init` receives the `Config.Scope`."
      - id: c
        text: "`close`, at shutdown."
        explanation: "Not correct. `close` is too late."
      - id: d
        text: "`getId`, with the id."
        explanation: "Not correct. `getId` only returns the id."
    correct_option: b
    explanation: "Correct. Read once in `init` and keep the value in a field."

  - id: ats092-010-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Key in the scope"
    source_readings:
      - sections/section-010/module-02/course-02-reading-settings-in-a-factory.md
    prompt: "Which key does the code pass to `config.get(...)` for the setting `--spi-realm-restapi-extension--inventory-status--mode`?"
    options:
      - id: a
        text: "The full setting name."
        explanation: "Not correct. The scope holds only this provider's settings."
      - id: b
        text: "`inventory-status--mode`."
        explanation: "Not correct. The provider id is already part of the scope."
      - id: c
        text: "`mode`."
        explanation: "Correct. Only the short key is needed."
      - id: d
        text: "`spi-mode`."
        explanation: "Not correct. The prefix is not part of the key."
    correct_option: c
    explanation: "Correct. The scope is already narrowed to the provider."

  - id: ats092-010-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Default values"
    source_readings:
      - sections/section-010/module-02/course-02-reading-settings-in-a-factory.md
    prompt: "Why should a provider pass a default to `config.get`?"
    options:
      - id: a
        text: "It still works when the administrator sets nothing."
        explanation: "Correct. Without a default, the value is `null`."
      - id: b
        text: "Keycloak refuses to start without one."
        explanation: "Not correct. There is no such rule."
      - id: c
        text: "The default is stored in the realm."
        explanation: "Not correct. Defaults stay in the code."
      - id: d
        text: "The default speeds up the start."
        explanation: "Not correct. Defaults have no speed effect."
    correct_option: a
    explanation: "Correct. A missing setting must not break the provider."

  - id: ats092-010-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "Disable a provider"
    source_readings:
      - sections/section-010/module-02/course-03-enabling-disabling-and-choosing-providers.md
    prompt: "Which setting switches off a provider but keeps its JAR loaded?"
    options:
      - id: a
        text: "`delete=true`"
        explanation: "Not correct. No such setting exists."
      - id: b
        text: "`provider=none`"
        explanation: "Not correct. `provider` chooses a default."
      - id: c
        text: "`order=0`"
        explanation: "Not correct. `order` does not disable."
      - id: d
        text: "`enabled=false`"
        explanation: "Correct. Every provider accepts `enabled`."
    correct_option: d
    explanation: "Correct. The factory is not used while `enabled` is false."

  - id: ats092-010-q22
    type: single_choice
    difficulty: advanced
    learning_objective: "Default provider"
    source_readings:
      - sections/section-010/module-02/course-03-enabling-disabling-and-choosing-providers.md
    prompt: "Two providers of one SPI exist and no `provider` setting is present. Which does Keycloak use?"
    options:
      - id: a
        text: "The one with the smaller JAR file."
        explanation: "Not correct. File size is not used."
      - id: b
        text: "The factory whose `order()` returns the highest number."
        explanation: "Correct. `order()` breaks the tie."
      - id: c
        text: "The one loaded last."
        explanation: "Not correct. Load order is not used."
      - id: d
        text: "Both at the same time."
        explanation: "Not correct. Only SPIs such as event listeners use all providers."
    correct_option: b
    explanation: "Correct. Set `provider` explicitly when it matters."

  - id: ats092-010-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Secret values"
    source_readings:
      - sections/section-010/module-02/course-04-supplying-settings-in-kubernetes.md
    prompt: "Where should a secret setting value come from in a Deployment?"
    options:
      - id: a
        text: "A plain `value` in the `env` entry."
        explanation: "Not correct. Anyone who reads the Deployment sees it."
      - id: b
        text: "A ConfigMap key."
        explanation: "Not correct. A ConfigMap is not for secrets."
      - id: c
        text: "A Secret, through `secretKeyRef`."
        explanation: "Correct. A Secret is the right object for secret values."
      - id: d
        text: "The container image."
        explanation: "Not correct. An image should not hold secrets."
    correct_option: c
    explanation: "Correct. Use `valueFrom` with `secretKeyRef`."

  - id: ats092-010-q24
    type: single_choice
    difficulty: advanced
    learning_objective: "Mounting keycloak.conf"
    source_readings:
      - sections/section-010/module-02/course-04-supplying-settings-in-kubernetes.md
    prompt: "Why does the volume mount of `keycloak.conf` use `subPath`?"
    options:
      - id: a
        text: "So it replaces one file without hiding the rest of the `conf` directory."
        explanation: "Correct. Without `subPath` the whole directory is replaced."
      - id: b
        text: "So the file is read-only for root."
        explanation: "Not correct. `subPath` does not set permissions."
      - id: c
        text: "So Keycloak reloads it without a restart."
        explanation: "Not correct. A restart is still needed."
      - id: d
        text: "So the file is stored in the database."
        explanation: "Not correct. Files stay on the volume."
    correct_option: a
    explanation: "Correct. Mount one file, not the directory."
