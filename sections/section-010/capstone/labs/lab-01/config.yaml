# Get A Broken Provider Build Running
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-092-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the provider and Maven volumes and the tester pod, and creates the realm inventory"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-092-capstone-010-setup"
      description: "Uploads inventory-status source that does not compile and names a factory class that does not exist, and runs the failing build"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-build-succeeded"
      description: "Confirms the last run of the build-provider Job succeeded"
      type: "file"
      source: "validation/validate-build-succeeded.sh"
    - name: "validate-keycloak-ready"
      description: "Confirms the Keycloak Deployment has a ready pod"
      type: "file"
      source: "validation/validate-keycloak-ready.sh"
    - name: "validate-provider-in-serverinfo"
      description: "Confirms serverinfo lists the provider inventory-status"
      type: "file"
      source: "validation/validate-provider-in-serverinfo.sh"
    - name: "validate-endpoint-answers"
      description: "Confirms GET /realms/inventory/inventory-status answers from the tester pod"
      type: "file"
      source: "validation/validate-endpoint-answers.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - maven:3.9.15-eclipse-temurin-21
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
