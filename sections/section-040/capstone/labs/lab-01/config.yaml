# Ship A Theme And A Listener In One JAR
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-092-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the provider and Maven volumes and the tester pod, and creates the realm inventory"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-092-capstone-040-setup"
      description: "Builds a JAR whose theme descriptor and listener registration are wrong, and selects the theme inventory"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-keycloak-ready"
      description: "Confirms the Keycloak Deployment has a ready pod"
      type: "file"
      source: "validation/validate-keycloak-ready.sh"
    - name: "validate-theme-from-jar"
      description: "Confirms the theme is not mounted as a directory and only one provider JAR is loaded"
      type: "file"
      source: "validation/validate-theme-from-jar.sh"
    - name: "validate-theme-selected"
      description: "Confirms the realm inventory uses the login theme inventory"
      type: "file"
      source: "validation/validate-theme-selected.sh"
    - name: "validate-login-page-text"
      description: "Fetches the login page from the tester pod and confirms the theme's heading"
      type: "file"
      source: "validation/validate-login-page-text.sh"
    - name: "validate-listeners-enabled"
      description: "Confirms the realm inventory sends events to jboss-logging and audit-log"
      type: "file"
      source: "validation/validate-listeners-enabled.sh"
    - name: "validate-login-logged"
      description: "Signs alice in and confirms the audit-log listener writes the LOGIN line"
      type: "file"
      source: "validation/validate-login-logged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - maven:3.9.15-eclipse-temurin-21
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
