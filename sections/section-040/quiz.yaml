# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats092-040
course_id: ATS092
exam_code: KEYCLOAK
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Themes With FreeMarker"
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
  - id: ats092-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the theme types"
    source_readings:
      - sections/section-040/module-01/course-01-theme-types-and-inheritance.md
    prompt: "Which theme type renders the sign-in form and the password reset page?"
    options:
      - id: a
        text: "`login`"
        explanation: "Correct. The login type renders the pages of a sign-in."
      - id: b
        text: "`account`"
        explanation: "Not correct. This type renders the account console."
      - id: c
        text: "`admin`"
        explanation: "Not correct. This type renders the Admin Console."
      - id: d
        text: "`welcome`"
        explanation: "Not correct. This type renders the page at the server's root."
    correct_option: a
    explanation: "Correct. The login type renders the pages of a sign-in."

  - id: ats092-040-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the smallest change"
    source_readings:
      - sections/section-040/module-01/course-01-theme-types-and-inheritance.md
    prompt: "You want to change only the login page heading. What is the smallest change?"
    options:
      - id: a
        text: "Copy `login.ftl` and edit it."
        explanation: "Not correct. A copied template must be checked on every upgrade."
      - id: b
        text: "Edit the built-in `keycloak` theme in the server."
        explanation: "Not correct. Files inside the server are replaced on upgrade."
      - id: c
        text: "Change the realm's `emailTheme`."
        explanation: "Not correct. This changes emails, not the login page."
      - id: d
        text: "Override the message key `loginAccountTitle` in your own theme's message file."
        explanation: "Correct. The template stays the same, so upgrades are safer."
    correct_option: d
    explanation: "Correct. The template stays the same, so upgrades are safer."

  - id: ats092-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Follow the parent lookup"
    source_readings:
      - sections/section-040/module-01/course-01-theme-types-and-inheritance.md
    prompt: "Keycloak needs a file that your theme does not have. What does it do?"
    options:
      - id: a
        text: "It shows an error page."
        explanation: "Not correct. Missing files fall back to the parent."
      - id: b
        text: "It looks in the realm `master`."
        explanation: "Not correct. Themes are not looked up in realms."
      - id: c
        text: "It looks in the theme named by `parent`, then in that theme's parent."
        explanation: "Correct. Messages are merged the same way."
      - id: d
        text: "It creates an empty file."
        explanation: "Not correct. Keycloak does not create theme files."
    correct_option: c
    explanation: "Correct. Messages are merged the same way."

  - id: ats092-040-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain templates and messages"
    source_readings:
      - sections/section-040/module-01/course-01-theme-types-and-inheritance.md
    prompt: "In `${msg(\"loginAccountTitle\")}`, what decides the text that is shown?"
    options:
      - id: a
        text: "The FreeMarker template alone."
        explanation: "Not correct. The template only holds the key."
      - id: b
        text: "The message file for the user's language, such as `messages_en.properties`."
        explanation: "Correct. The template decides where, the message file decides what."
      - id: c
        text: "The realm's name."
        explanation: "Not correct. The realm's name does not change the message."
      - id: d
        text: "The Keycloak pod's name."
        explanation: "Not correct. Pod names play no part."
    correct_option: b
    explanation: "Correct. The template decides where, the message file decides what."

  - id: ats092-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place a theme directory"
    source_readings:
      - sections/section-040/module-01/course-02-a-theme-in-a-mounted-directory.md
    prompt: "Where must a theme named `inventory` with type `login` be in the Keycloak pod?"
    options:
      - id: a
        text: "`/opt/keycloak/themes/inventory/login/`"
        explanation: "Correct. The path is themes, theme name, type."
      - id: b
        text: "`/opt/keycloak/providers/inventory/`"
        explanation: "Not correct. The providers directory holds JARs."
      - id: c
        text: "`/opt/keycloak/conf/inventory-theme/`"
        explanation: "Not correct. Keycloak does not look for themes there."
      - id: d
        text: "`/tmp/themes/inventory/login/`"
        explanation: "Not correct. Keycloak does not read `/tmp`."
    correct_option: a
    explanation: "Correct. The path is themes, theme name, type."

  - id: ats092-040-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "Mount a ConfigMap as a theme"
    source_readings:
      - sections/section-040/module-01/course-02-a-theme-in-a-mounted-directory.md
    prompt: "Why does the theme volume use `items` with a `path` for each key?"
    options:
      - id: a
        text: "`items` encrypts the files."
        explanation: "Not correct. It only maps keys to paths."
      - id: b
        text: "`items` makes Keycloak cache the theme."
        explanation: "Not correct. Caching is a server setting."
      - id: c
        text: "`items` selects the theme for the realm."
        explanation: "Not correct. The realm's `loginTheme` selects it."
      - id: d
        text: "A ConfigMap volume is flat by default, and the theme needs folders such as `messages/`."
        explanation: "Correct. `items` maps each key to a path below the mount point."
    correct_option: d
    explanation: "Correct. `items` maps each key to a path below the mount point."

  - id: ats092-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Avoid hiding other themes"
    source_readings:
      - sections/section-040/module-01/course-02-a-theme-in-a-mounted-directory.md
    prompt: "What happens if you mount the theme ConfigMap at `/opt/keycloak/themes`?"
    options:
      - id: a
        text: "Nothing, because Keycloak merges the folders."
        explanation: "Not correct. A mount hides what was in the folder."
      - id: b
        text: "Keycloak deletes the built-in themes."
        explanation: "Not correct. They are inside the server and stay."
      - id: c
        text: "It hides every other theme directory in that folder; mount at `/opt/keycloak/themes/<theme name>`."
        explanation: "Correct. The mount replaces the folder's content."
      - id: d
        text: "The theme is selected automatically."
        explanation: "Not correct. A realm must still select it."
    correct_option: c
    explanation: "Correct. The mount replaces the folder's content."

  - id: ats092-040-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Select the theme"
    source_readings:
      - sections/section-040/module-01/course-02-a-theme-in-a-mounted-directory.md
    prompt: "Keycloak lists the theme `inventory`, but the login page still shows the default heading. What is missing?"
    options:
      - id: a
        text: "A restart after every message change."
        explanation: "Not correct. Development mode shows changes without a restart."
      - id: b
        text: "The realm's `loginTheme` is not set to `inventory`."
        explanation: "Correct. A found theme changes nothing until a realm selects it."
      - id: c
        text: "A second parent theme."
        explanation: "Not correct. One parent is enough."
      - id: d
        text: "A new `pom.xml`."
        explanation: "Not correct. A mounted theme directory needs no Maven build."
    correct_option: b
    explanation: "Correct. A found theme changes nothing until a realm selects it."

  - id: ats092-040-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Match names in keycloak-themes.json"
    source_readings:
      - sections/section-040/module-01/course-03-packaging-a-theme-in-a-jar.md
    prompt: "A theme JAR holds `theme/inventory/login/` but `keycloak-themes.json` lists the name `inventory-jar`. What is the effect?"
    options:
      - id: a
        text: "Keycloak cannot find the theme's files, because the name must match the folder under `theme/`."
        explanation: "Correct. Keycloak uses the name to find the folder."
      - id: b
        text: "Keycloak renames the folder."
        explanation: "Not correct. Keycloak never renames files."
      - id: c
        text: "The theme works, because the JAR name is used."
        explanation: "Not correct. The descriptor name is used."
      - id: d
        text: "Only the email theme is affected."
        explanation: "Not correct. The theme is not found for any type."
    correct_option: a
    explanation: "Correct. Keycloak uses the name to find the folder."

  - id: ats092-040-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Check both halves of one JAR"
    source_readings:
      - sections/section-040/module-01/course-03-packaging-a-theme-in-a-jar.md
    prompt: "A JAR holds a theme and an event listener. The theme shows on the login page, but `audit-log` is missing from the provider list. Where do you look?"
    options:
      - id: a
        text: "At `keycloak-themes.json`, because it registers providers."
        explanation: "Not correct. It lists only themes."
      - id: b
        text: "At the realm's `loginTheme`, because it loads providers."
        explanation: "Not correct. It selects a theme only."
      - id: c
        text: "At the Keycloak version in the `pom.xml` of the theme."
        explanation: "Not correct. The theme half works, so the build is fine."
      - id: d
        text: "At the services file, because the two halves of the JAR can fail independently."
        explanation: "Correct. A misnamed services file hides the provider while the theme works."
    correct_option: d
    explanation: "Correct. A misnamed services file hides the provider while the theme works."

  - id: ats092-040-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Default value"
    source_readings:
      - sections/section-040/module-01/course-04-freemarker-templates.md
    prompt: "How does FreeMarker print an empty string when a value is missing?"
    options:
      - id: a
        text: "`${value!\"\"}`"
        explanation: "Correct. The `!` operator gives a default."
      - id: b
        text: "`${value?}`"
        explanation: "Not correct. This is not valid."
      - id: c
        text: "`${value or \"\"}`"
        explanation: "Not correct. FreeMarker uses `!` for defaults."
      - id: d
        text: "`<#default value>`"
        explanation: "Not correct. This directive does not exist."
    correct_option: a
    explanation: "Correct. Without a default, a missing value stops the template."

  - id: ats092-040-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Layout sections"
    source_readings:
      - sections/section-040/module-01/course-04-freemarker-templates.md
    prompt: "Which macro draws the frame of a login page in the `keycloak` theme?"
    options:
      - id: a
        text: "`registrationLayout` from `template.ftl`"
        explanation: "Correct. The page fills its named sections."
      - id: b
        text: "`<#include login>`"
        explanation: "Not correct. This is not how pages are built."
      - id: c
        text: "`url.loginAction`"
        explanation: "Not correct. This is a form address."
      - id: d
        text: "`msg`"
        explanation: "Not correct. This returns text."
    correct_option: a
    explanation: "Correct. The macro draws the frame and the page fills the sections."

  - id: ats092-040-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Static file address"
    source_readings:
      - sections/section-040/module-01/course-05-resources-and-localisation.md
    prompt: "How does a template build the address of an image in `resources/img`?"
    options:
      - id: a
        text: "With `${url.resourcesPath}/img/logo.png`."
        explanation: "Correct. The value includes the version."
      - id: b
        text: "With `/themes/inventory/logo.png`."
        explanation: "Not correct. This path is not served."
      - id: c
        text: "With the file path in the ConfigMap."
        explanation: "Not correct. The browser cannot read it."
      - id: d
        text: "With `file:///opt/keycloak/themes`."
        explanation: "Not correct. A browser cannot open this."
    correct_option: a
    explanation: "Correct. Never write the resource path by hand."

  - id: ats092-040-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Second language"
    source_readings:
      - sections/section-040/module-01/course-05-resources-and-localisation.md
    prompt: "Which two things turn a second language on for the login page?"
    options:
      - id: a
        text: "`locales` in the theme and internationalisation in the realm."
        explanation: "Correct. Both are needed."
      - id: b
        text: "Only a `messages_da.properties` file."
        explanation: "Not correct. The realm must list the locale as well."
      - id: c
        text: "Only the realm setting."
        explanation: "Not correct. The theme must list the locale."
      - id: d
        text: "A new Keycloak image."
        explanation: "Not correct. No image change is needed."
    correct_option: a
    explanation: "Correct. The theme lists the locales and the realm enables them."

  - id: ats092-040-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the theme folder"
    source_readings:
      - sections/section-040/module-02/course-01-email-theme-anatomy.md
    prompt: "Where does Keycloak read the messages of an email theme named `inventory`?"
    options:
      - id: a
        text: "`/opt/keycloak/themes/inventory/login/messages/`"
        explanation: "Not correct. That is the folder of a login theme."
      - id: b
        text: "`/opt/keycloak/themes/inventory/email/messages/`"
        explanation: "Correct. The folder name is the theme type."
      - id: c
        text: "`/opt/keycloak/themes/email/inventory/`"
        explanation: "Not correct. The theme name comes first."
      - id: d
        text: "`/opt/keycloak/providers/inventory/`"
        explanation: "Not correct. That folder is for provider JAR files."
    correct_option: b
    explanation: "Correct. An email theme lives below `<theme name>/email/`."

  - id: ats092-040-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the files of one mail"
    source_readings:
      - sections/section-040/module-02/course-01-email-theme-anatomy.md
    prompt: "Which files does Keycloak use for the password reset email?"
    options:
      - id: a
        text: "Only `email/html/password-reset.ftl`."
        explanation: "Not correct. The text version is needed too."
      - id: b
        text: "Only a message file."
        explanation: "Not correct. The templates come from a parent theme if the theme has none."
      - id: c
        text: "`email/html/password-reset.ftl` and `email/text/password-reset.ftl`."
        explanation: "Correct. Every mail is sent as HTML and as plain text."
      - id: d
        text: "`email/password-reset.html`."
        explanation: "Not correct. Keycloak does not use that file."
    correct_option: c
    explanation: "Correct. A mail has an HTML template and a plain-text template."

  - id: ats092-040-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell the theme from the mail server"
    source_readings:
      - sections/section-040/module-02/course-01-email-theme-anatomy.md
    prompt: "A realm uses a custom email theme, but no mail arrives. Which setting decides whether a mail can be sent at all?"
    options:
      - id: a
        text: "`emailTheme`"
        explanation: "Not correct. It changes only the content."
      - id: b
        text: "`smtpServer`"
        explanation: "Correct. It holds the host, port and sender."
      - id: c
        text: "`accountTheme`"
        explanation: "Not correct. It styles the account console."
      - id: d
        text: "`defaultLocale`"
        explanation: "Not correct. It chooses the language."
    correct_option: b
    explanation: "Correct. The theme changes the content; the mail server settings decide whether a mail leaves."

  - id: ats092-040-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Diagnose a flat mount"
    source_readings:
      - sections/section-040/module-02/course-02-changing-email-text-from-a-configmap.md
    prompt: "Keycloak does not list the email theme `inventory`. `find /opt/keycloak/themes/inventory` shows `theme.properties` and `messages_en.properties` side by side. What is wrong?"
    options:
      - id: a
        text: "The ConfigMap is too large."
        explanation: "Not correct. Size is not the cause."
      - id: b
        text: "The volume has no `items`, so the keys are in one flat folder."
        explanation: "Correct. Keycloak needs `email/theme.properties` and `email/messages/messages_en.properties`."
      - id: c
        text: "The realm has no `emailTheme`."
        explanation: "Not correct. Keycloak lists a theme before a realm selects it."
      - id: d
        text: "Keycloak needs a JAR for every theme."
        explanation: "Not correct. A directory works."
    correct_option: b
    explanation: "Correct. The `items` list gives each key a path."

  - id: ats092-040-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the smallest change"
    source_readings:
      - sections/section-040/module-02/course-02-changing-email-text-from-a-configmap.md
    prompt: "The team wants only a new subject for the password reset mail. What is the smallest change?"
    options:
      - id: a
        text: "Copy both templates and edit them."
        explanation: "Not correct. That is more than needed."
      - id: b
        text: "Write a JAR with a new provider."
        explanation: "Not correct. A theme needs no provider."
      - id: c
        text: "Change the realm's `smtpServer`."
        explanation: "Not correct. That is the mail server."
      - id: d
        text: "Override `passwordResetSubject` in `messages_en.properties` of an email theme."
        explanation: "Correct. One message key changes the subject."
    correct_option: d
    explanation: "Correct. Override the message and inherit everything else."

  - id: ats092-040-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict the fallback"
    source_readings:
      - sections/section-040/module-02/course-02-changing-email-text-from-a-configmap.md
    prompt: "A realm sets `emailTheme` to `inventory`, but Keycloak does not have a theme with that name. What happens?"
    options:
      - id: a
        text: "The realm falls back to the default email theme."
        explanation: "Correct. The realm uses the default theme."
      - id: b
        text: "Keycloak refuses to start."
        explanation: "Not correct. The server starts."
      - id: c
        text: "Keycloak deletes the setting."
        explanation: "Not correct. The field stays as it is."
      - id: d
        text: "Every mail fails."
        explanation: "Not correct. Mails use the default theme."
    correct_option: a
    explanation: "Correct. A missing theme gives the default theme, so the change seems to have no effect."

  - id: ats092-040-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the right layout elements"
    source_readings:
      - sections/section-040/module-02/course-03-email-templates.md
    prompt: "What does `?no_esc` do in `${kcSanitize(msg(\"passwordResetBodyHtml\", ...))?no_esc}`?"
    options:
      - id: a
        text: "It removes the message from the mail."
        explanation: "Not correct. The message stays."
      - id: b
        text: "It stops FreeMarker from escaping the markup of the message a second time."
        explanation: "Correct. `kcSanitize` has already removed unsafe markup."
      - id: c
        text: "It turns the HTML into plain text."
        explanation: "Not correct. The plain-text mail has its own template."
      - id: d
        text: "It skips the language lookup."
        explanation: "Not correct. `msg` still uses the language."
    correct_option: b
    explanation: "Correct. The sanitised markup is printed as markup."

  - id: ats092-040-q22
    type: single_choice
    difficulty: advanced
    learning_objective: "Avoid a missing-value error"
    source_readings:
      - sections/section-040/module-02/course-03-email-templates.md
    prompt: "A template prints `${user.firstName}` and a user has no first name. What happens?"
    options:
      - id: a
        text: "It prints an empty string."
        explanation: "Not correct. FreeMarker does not do that by default."
      - id: b
        text: "It prints `null`."
        explanation: "Not correct. FreeMarker does not print `null`."
      - id: c
        text: "The template stops with an error, unless a default such as `${user.firstName!\"\"}` is given."
        explanation: "Correct. The operator `!` gives a default."
      - id: d
        text: "Keycloak uses the realm name instead."
        explanation: "Not correct. Keycloak does not substitute a value."
    correct_option: c
    explanation: "Correct. Give optional values a default with `!`."

  - id: ats092-040-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Understand the account console"
    source_readings:
      - sections/section-040/module-02/course-04-the-account-theme-and-languages.md
    prompt: "Why can you not override a page of the account console `keycloak.v3` by writing an `.ftl` file?"
    options:
      - id: a
        text: "Account themes cannot have parents."
        explanation: "Not correct. They can inherit with `parent`."
      - id: b
        text: "The account console reads only the database."
        explanation: "Not correct. It reads through REST APIs."
      - id: c
        text: "`.ftl` files are only allowed in JAR files."
        explanation: "Not correct. A directory also works."
      - id: d
        text: "The console is a single-page application, so it has no page templates to override."
        explanation: "Correct. You change messages, style and resources."
    correct_option: d
    explanation: "Correct. The pages are drawn in the browser by an application."

  - id: ats092-040-q24
    type: single_choice
    difficulty: beginner
    learning_objective: "Turn on languages"
    source_readings:
      - sections/section-040/module-02/course-04-the-account-theme-and-languages.md
    prompt: "Which three realm fields turn on a language choice with English and Danish?"
    options:
      - id: a
        text: "`internationalizationEnabled`, `supportedLocales` and `defaultLocale`"
        explanation: "Correct. They enable the choice, list the codes and set the default."
      - id: b
        text: "`emailTheme`, `accountTheme` and `loginTheme`"
        explanation: "Not correct. Those select themes."
      - id: c
        text: "`eventsEnabled`, `eventsExpiration` and `eventsListeners`"
        explanation: "Not correct. Those are event settings."
      - id: d
        text: "`smtpServer`, `sslRequired` and `enabled`"
        explanation: "Not correct. They do not concern languages."
    correct_option: a
    explanation: "Correct. Languages are a realm setting that every theme type reads."
