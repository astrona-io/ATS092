# Change The Login Page With A Theme (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-092-playground-040-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Deploy Keycloak 26.8.1 with the provider and Maven volumes and the tester pod, create the realm inventory with the module's users and clients, and fill the Maven cache."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Starting workloads (namespace themes-demo, keycloak-admin Secret, keycloak-providers and maven-cache PVCs, keycloak Deployment and Service, tester client)."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
