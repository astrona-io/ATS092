# Fix An Email Theme That Keycloak Cannot Find
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-092-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the provider and Maven volumes and the tester pod, and creates the realm inventory"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-092-lab-040-02-setup"
      description: "Creates the ConfigMap inventory-email-theme and mounts it as a flat folder at /opt/keycloak/themes/inventory, so Keycloak cannot find the theme"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-keycloak-ready"
      description: "Confirms the Keycloak Deployment has a ready pod"
      type: "file"
      source: "validation/validate-keycloak-ready.sh"
    - name: "validate-theme-mounted"
      description: "Confirms the email theme files are at the paths Keycloak reads"
      type: "file"
      source: "validation/validate-theme-mounted.sh"
    - name: "validate-theme-selected"
      description: "Confirms Keycloak lists the email theme inventory and the realm inventory uses it"
      type: "file"
      source: "validation/validate-theme-selected.sh"
    - name: "validate-subject-message"
      description: "Confirms the theme sets the password reset subject"
      type: "file"
      source: "validation/validate-subject-message.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - maven:3.9.15-eclipse-temurin-21
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
