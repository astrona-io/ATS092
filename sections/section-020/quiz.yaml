# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats092-020
course_id: ATS092
exam_code: KEYCLOAK
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Custom Authenticators"
placement:
  position: after
  reading: sections/section-020/capstone/labs/lab-01/question.md
questions:
  - id: ats092-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain the DISABLED requirement"
    source_readings:
      - sections/section-020/module-01/course-01-flows-executions-and-requirements.md
    prompt: "What does Keycloak do with an execution whose requirement is `DISABLED`?"
    options:
      - id: a
        text: "It never runs the step, so the step can never refuse anyone."
        explanation: "Correct. `DISABLED` is the quietest way to switch a check off."
      - id: b
        text: "It runs the step and ignores a failure."
        explanation: "Not correct. A disabled step does not run at all."
      - id: c
        text: "It runs the step only for the user `admin`."
        explanation: "Not correct. Requirements do not depend on the user name."
      - id: d
        text: "It deletes the step from the flow."
        explanation: "Not correct. The step stays in the flow, it just does not run."
    correct_option: a
    explanation: "Correct. `DISABLED` is the quietest way to switch a check off."

  - id: ats092-020-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Bind a flow to one client"
    source_readings:
      - sections/section-020/module-01/course-01-flows-executions-and-requirements.md
    prompt: "Which client setting gives one client a different direct grant flow without changing the realm's binding?"
    options:
      - id: a
        text: "`directGrantFlow` on the realm."
        explanation: "Not correct. This is the realm binding and changes every client."
      - id: b
        text: "`eventsListeners` on the realm."
        explanation: "Not correct. This lists event listeners, not flows."
      - id: c
        text: "`loginTheme` on the client."
        explanation: "Not correct. A theme changes how pages look, not which flow runs."
      - id: d
        text: "`authenticationFlowBindingOverrides`, which maps `direct_grant` to a flow id."
        explanation: "Correct. The override only affects that client."
    correct_option: d
    explanation: "Correct. The override only affects that client."

  - id: ats092-020-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "End authenticate() correctly"
    source_readings:
      - sections/section-020/module-01/course-02-writing-an-authenticator.md
    prompt: "How must every path through `authenticate()` end?"
    options:
      - id: a
        text: "With a `return null`."
        explanation: "Not correct. Returning without an answer leaves the flow without a result."
      - id: b
        text: "With a restart of the Keycloak pod."
        explanation: "Not correct. A pod restart is never part of a flow step."
      - id: c
        text: "With a call to `context.success()` or `context.failure(error, response)`."
        explanation: "Correct. Keycloak needs one of the two answers to continue or stop the flow."
      - id: d
        text: "With an HTML login page in every case."
        explanation: "Not correct. A direct grant has no pages, and the step must still answer."
    correct_option: c
    explanation: "Correct. Keycloak needs one of the two answers to continue or stop the flow."

  - id: ats092-020-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Send the right failure response in a direct grant"
    source_readings:
      - sections/section-020/module-01/course-02-writing-an-authenticator.md
    prompt: "What should a failing authenticator in a direct grant send to the client?"
    options:
      - id: a
        text: "An HTML error page with status `200`."
        explanation: "Not correct. The client expects JSON, not HTML."
      - id: b
        text: "A JSON body in the OAuth 2.0 error format, with `error` set to `invalid_grant` and status `401`."
        explanation: "Correct. The client of a direct grant expects JSON."
      - id: c
        text: "An empty response with status `204`."
        explanation: "Not correct. That signals success with no content."
      - id: d
        text: "A redirect to the browser login page."
        explanation: "Not correct. A direct grant has no browser."
    correct_option: b
    explanation: "Correct. The client of a direct grant expects JSON."

  - id: ats092-020-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use requiresUser()"
    source_readings:
      - sections/section-020/module-01/course-02-writing-an-authenticator.md
    prompt: "Why does the department authenticator return `true` from `requiresUser()`?"
    options:
      - id: a
        text: "The step reads the user's attribute, so Keycloak must run it only after a step has found the user."
        explanation: "Correct. Without it the step might run before any user is known."
      - id: b
        text: "It makes the step show a form to the user."
        explanation: "Not correct. The step shows no form; `action()` stays empty."
      - id: c
        text: "It lets the user choose the requirement."
        explanation: "Not correct. `getRequirementChoices()` limits what an administrator may pick."
      - id: d
        text: "It stores the user in the factory."
        explanation: "Not correct. The authenticator keeps no state between calls."
    correct_option: a
    explanation: "Correct. Without it the step might run before any user is known."

  - id: ats092-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe the factory methods"
    source_readings:
      - sections/section-020/module-01/course-02-writing-an-authenticator.md
    prompt: "What does `getRequirementChoices()` return in an `AuthenticatorFactory`?"
    options:
      - id: a
        text: "The users who may pass the step."
        explanation: "Not correct. The step decides about users in `authenticate()`."
      - id: b
        text: "The list of clients that may use the step."
        explanation: "Not correct. Clients are chosen by the flow binding."
      - id: c
        text: "The name of the services file."
        explanation: "Not correct. The services file is named after the factory interface."
      - id: d
        text: "The requirements an administrator may pick for the step, here `REQUIRED` and `DISABLED`."
        explanation: "Correct. It limits the choices in the Admin Console and the Admin REST API."
    correct_option: d
    explanation: "Correct. It limits the choices in the Admin Console and the Admin REST API."

  - id: ats092-020-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the services file for an authenticator"
    source_readings:
      - sections/section-020/module-01/course-02-writing-an-authenticator.md
    prompt: "What is the name of the services file that registers an authenticator factory?"
    options:
      - id: a
        text: "`META-INF/services/org.keycloak.authentication.Authenticator`"
        explanation: "Not correct. This is the provider interface, not the factory interface."
      - id: b
        text: "`META-INF/services/require-department-attribute`"
        explanation: "Not correct. The provider id is not a file name."
      - id: c
        text: "`META-INF/services/org.keycloak.authentication.AuthenticatorFactory`"
        explanation: "Correct. The file is named after the factory interface."
      - id: d
        text: "`META-INF/keycloak-themes.json`"
        explanation: "Not correct. This file lists themes."
    correct_option: c
    explanation: "Correct. The file is named after the factory interface."

  - id: ats092-020-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Handle a new execution"
    source_readings:
      - sections/section-020/module-01/course-03-wiring-an-authenticator-into-a-flow.md
    prompt: "You add the execution `require-department-attribute` to a copied flow. Every user, including one without a department, still gets a token. What is the most likely reason?"
    options:
      - id: a
        text: "The authenticator was not built into the JAR."
        explanation: "Not correct. Without the JAR you could not add the execution."
      - id: b
        text: "A new execution starts as `DISABLED`, so the step never runs."
        explanation: "Correct. You must set the requirement to `REQUIRED`."
      - id: c
        text: "A new execution starts as `ALTERNATIVE` and the user passes the password step."
        explanation: "Not correct. A new execution starts as `DISABLED`."
      - id: d
        text: "The realm needs a restart to run executions."
        explanation: "Not correct. Flows are realm data and apply at once."
    correct_option: b
    explanation: "Correct. You must set the requirement to `REQUIRED`."

  - id: ats092-020-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Keep the priority when changing an execution"
    source_readings:
      - sections/section-020/module-01/course-03-wiring-an-authenticator-into-a-flow.md
    prompt: "You set an execution to `REQUIRED` with `--no-merge` and a body without its priority. Every sign-in now fails with `unknown_error`. Why?"
    options:
      - id: a
        text: "The priority drops to `0`, the step moves before the username step, and it runs before Keycloak knows the user."
        explanation: "Correct. Keycloak orders steps by `priority`, so the body must carry the current one."
      - id: b
        text: "`--no-merge` deletes the user from the realm."
        explanation: "Not correct. It replaces the execution, not the users."
      - id: c
        text: "`REQUIRED` is not allowed for custom authenticators."
        explanation: "Not correct. The factory allows `REQUIRED`."
      - id: d
        text: "The flow alias contains a space."
        explanation: "Not correct. The space only matters in the URL path."
    correct_option: a
    explanation: "Correct. Keycloak orders steps by `priority`, so the body must carry the current one."

  - id: ats092-020-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose a safe way to add a rule"
    source_readings:
      - sections/section-020/module-01/course-03-wiring-an-authenticator-into-a-flow.md
    prompt: "One client needs a stricter sign-in. Which approach changes only that client?"
    options:
      - id: a
        text: "Add the step to the built-in `direct grant` flow."
        explanation: "Not correct. Every client that uses the binding gets the rule."
      - id: b
        text: "Set the realm's `directGrantFlow` to the new flow."
        explanation: "Not correct. This applies the rule to every client in the realm."
      - id: c
        text: "Set the override to the new flow's alias."
        explanation: "Not correct. The override takes the flow's id, not its alias."
      - id: d
        text: "Copy the built-in flow, add the step to the copy, and set the client's override to the copy's id."
        explanation: "Correct. The realm binding and other clients stay unchanged."
    correct_option: d
    explanation: "Correct. The realm binding and other clients stay unchanged."

  - id: ats092-020-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Challenge"
    source_readings:
      - sections/section-020/module-01/course-04-forms-and-challenges.md
    prompt: "Which call makes an authenticator show a page and wait for the form post?"
    options:
      - id: a
        text: "`context.challenge(response)`"
        explanation: "Correct. Keycloak then calls `action` after the post."
      - id: b
        text: "`context.success()`"
        explanation: "Not correct. This accepts the step."
      - id: c
        text: "`context.attempted()`"
        explanation: "Not correct. This skips the step."
      - id: d
        text: "`context.failure(error)`"
        explanation: "Not correct. This ends the flow with an error."
    correct_option: a
    explanation: "Correct. A challenge returns a page to the browser."

  - id: ats092-020-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Wrong value on a form"
    source_readings:
      - sections/section-020/module-01/course-04-forms-and-challenges.md
    prompt: "A user types a wrong value on the form of your authenticator. Which call shows the form again with an error?"
    options:
      - id: a
        text: "`context.failureChallenge(error, response)`"
        explanation: "Correct. It combines the error with a page."
      - id: b
        text: "`context.success()`"
        explanation: "Not correct. This accepts the value."
      - id: c
        text: "`context.attempted()`"
        explanation: "Not correct. This skips the step."
      - id: d
        text: "`context.forceChallenge(response)`"
        explanation: "Not correct. This does not report an error."
    correct_option: a
    explanation: "Correct. `failureChallenge` shows the page again with the error."

  - id: ats092-020-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Configuration of a step"
    source_readings:
      - sections/section-020/module-01/course-05-authenticator-configuration.md
    prompt: "What does `context.getAuthenticatorConfig()` return when the administrator saved no configuration for the step?"
    options:
      - id: a
        text: "`null`"
        explanation: "Correct. The code must check for it."
      - id: b
        text: "An empty map."
        explanation: "Not correct. It returns `null`, not a model."
      - id: c
        text: "The realm's default configuration."
        explanation: "Not correct. There is no realm default."
      - id: d
        text: "It throws an exception."
        explanation: "Not correct. It returns `null`."
    correct_option: a
    explanation: "Correct. Always check for `null` before you read the values."

  - id: ats092-020-q14
    type: single_choice
    difficulty: advanced
    learning_objective: "Configurable factory"
    source_readings:
      - sections/section-020/module-01/course-05-authenticator-configuration.md
    prompt: "Which interface must a factory implement to have settings in the admin console?"
    options:
      - id: a
        text: "`ConfigurableAuthenticatorFactory`"
        explanation: "Correct. It adds `getConfigProperties()`."
      - id: b
        text: "`RealmResourceProviderFactory`"
        explanation: "Not correct. This is for REST endpoints."
      - id: c
        text: "`EventListenerProviderFactory`"
        explanation: "Not correct. This is for event listeners."
      - id: d
        text: "`UserStorageProviderFactory`"
        explanation: "Not correct. This is for user storage."
    correct_option: a
    explanation: "Correct. `isConfigurable()` and `getConfigProperties()` come from this interface."

  - id: ats092-020-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Define a required action"
    source_readings:
      - sections/section-020/module-02/course-01-what-a-required-action-is.md
    prompt: "When does Keycloak show a required action?"
    options:
      - id: a
        text: "Before the authentication flow starts."
        explanation: "Not correct. The user is not known yet."
      - id: b
        text: "After the authentication flow succeeded, until the user completed it."
        explanation: "Correct. The user is known at that point."
      - id: c
        text: "Only when the administrator is signed in."
        explanation: "Not correct. Any user can have one."
      - id: d
        text: "Only during registration."
        explanation: "Not correct. It can run at any sign-in."
    correct_option: b
    explanation: "Correct. A required action is a step for a known user."

  - id: ats092-020-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Alias spelling"
    source_readings:
      - sections/section-020/module-02/course-01-what-a-required-action-is.md
    prompt: "Which is the alias of the built-in password change action?"
    options:
      - id: a
        text: "`update-password`"
        explanation: "Not correct. The built-in aliases are upper case."
      - id: b
        text: "`UpdatePassword`"
        explanation: "Not correct. The aliases use underscores."
      - id: c
        text: "`password`"
        explanation: "Not correct. This is not an alias."
      - id: d
        text: "`UPDATE_PASSWORD`"
        explanation: "Correct. Built-in aliases are upper case with underscores."
    correct_option: d
    explanation: "Correct. Use the alias exactly as `kcadm` lists it."

  - id: ats092-020-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Password grant"
    source_readings:
      - sections/section-020/module-02/course-01-what-a-required-action-is.md
    prompt: "What does a token request with the password grant return for a user who still has a required action?"
    options:
      - id: a
        text: "The error `invalid_grant` with the description `Account is not fully set up`."
        explanation: "Correct. There is no browser to show the action."
      - id: b
        text: "A token without roles."
        explanation: "Not correct. A token is not issued."
      - id: c
        text: "A redirect to a login page."
        explanation: "Not correct. The token endpoint returns JSON."
      - id: d
        text: "The required action is completed automatically."
        explanation: "Not correct. Only a page can complete it."
    correct_option: a
    explanation: "Correct. Check the user through the Admin REST API when you test."

  - id: ats092-020-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Services file name"
    source_readings:
      - sections/section-020/module-02/course-02-writing-a-required-action-provider.md
    prompt: "What is the name of the services file for a required action factory?"
    options:
      - id: a
        text: "`org.keycloak.authentication.RequiredActionProvider`"
        explanation: "Not correct. This is the provider interface, not the factory."
      - id: b
        text: "`org.keycloak.authentication.Authenticator`"
        explanation: "Not correct. This is for authenticators."
      - id: c
        text: "`org.keycloak.authentication.RequiredActionFactory`"
        explanation: "Correct. The file is named after the factory interface."
      - id: d
        text: "`required-action.properties`"
        explanation: "Not correct. Keycloak does not use this name."
    correct_option: c
    explanation: "Correct. The file name is the factory interface."

  - id: ats092-020-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Finish an action"
    source_readings:
      - sections/section-020/module-02/course-02-writing-a-required-action-provider.md
    prompt: "Which call removes the action from the user and lets the sign-in continue?"
    options:
      - id: a
        text: "`context.ignore()`"
        explanation: "Not correct. This keeps the action for the next sign-in."
      - id: b
        text: "`context.success()`"
        explanation: "Correct. It completes the action."
      - id: c
        text: "`context.failure()`"
        explanation: "Not correct. This ends the sign-in with an error."
      - id: d
        text: "`context.challenge(response)`"
        explanation: "Not correct. This shows a page."
    correct_option: b
    explanation: "Correct. `success()` removes the alias from the list."

  - id: ats092-020-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Loaded is not used"
    source_readings:
      - sections/section-020/module-02/course-02-writing-a-required-action-provider.md
    prompt: "The server info lists `accept-terms` under `required-action`, but no user ever sees it. What is the most likely reason?"
    options:
      - id: a
        text: "The JAR is too large."
        explanation: "Not correct. Size does not matter."
      - id: b
        text: "The action needs a restart of the realm."
        explanation: "Not correct. Realms have no restart."
      - id: c
        text: "The tester pod is stopped."
        explanation: "Not correct. It is unrelated."
      - id: d
        text: "No realm registered, enabled and assigned the action."
        explanation: "Correct. Loading is only the first step."
    correct_option: d
    explanation: "Correct. Load, register, enable, assign."

  - id: ats092-020-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Register an action"
    source_readings:
      - sections/section-020/module-02/course-03-registering-and-assigning-a-required-action.md
    prompt: "Which command registers a loaded required action in a realm?"
    options:
      - id: a
        text: "`kcadm create authentication/register-required-action -s providerId=accept-terms -s name=...`"
        explanation: "Correct. This is the registration endpoint."
      - id: b
        text: "`kcadm create required-actions`"
        explanation: "Not correct. No such resource exists."
      - id: c
        text: "`kc.sh register accept-terms`"
        explanation: "Not correct. `kc.sh` does not register actions."
      - id: d
        text: "`kcadm update realms/inventory -s requiredActions=accept-terms`"
        explanation: "Not correct. The realm has no such field."
    correct_option: a
    explanation: "Correct. Use the `providerId` from the factory."

  - id: ats092-020-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Replacing the list"
    source_readings:
      - sections/section-020/module-02/course-03-registering-and-assigning-a-required-action.md
    prompt: "What happens to the existing actions of a user when you send `requiredActions=[\"accept-terms\"]`?"
    options:
      - id: a
        text: "Keycloak adds the new alias to the list."
        explanation: "Not correct. The value replaces the list."
      - id: b
        text: "Keycloak ignores the request."
        explanation: "Not correct. The update is applied."
      - id: c
        text: "The list is replaced by the one you sent."
        explanation: "Correct. Read the old list first if you want to keep it."
      - id: d
        text: "Keycloak asks the user to confirm."
        explanation: "Not correct. No confirmation is asked."
    correct_option: c
    explanation: "Correct. The attribute is a full list."

  - id: ats092-020-q23
    type: single_choice
    difficulty: advanced
    learning_objective: "evaluateTriggers"
    source_readings:
      - sections/section-020/module-02/course-04-triggers-forms-and-completing-an-action.md
    prompt: "What is `evaluateTriggers` for?"
    options:
      - id: a
        text: "To show the form to the user."
        explanation: "Not correct. That is `requiredActionChallenge`."
      - id: b
        text: "To add the action to users who match a condition at sign-in."
        explanation: "Correct. It runs for every user on every sign-in."
      - id: c
        text: "To register the action in the realm."
        explanation: "Not correct. Registration is an admin step."
      - id: d
        text: "To remove the action after completion."
        explanation: "Not correct. `success()` does that."
    correct_option: b
    explanation: "Correct. Keep the method fast."

  - id: ats092-020-q24
    type: single_choice
    difficulty: advanced
    learning_objective: "ignore result"
    source_readings:
      - sections/section-020/module-02/course-04-triggers-forms-and-completing-an-action.md
    prompt: "A mandatory action calls `context.ignore()`. What does the user experience?"
    options:
      - id: a
        text: "The action stays on the user and returns at the next sign-in."
        explanation: "Correct. `ignore()` leaves the list unchanged."
      - id: b
        text: "The user is blocked for ever."
        explanation: "Not correct. The sign-in continues."
      - id: c
        text: "The action is removed."
        explanation: "Not correct. Only `success()` removes it."
      - id: d
        text: "Keycloak shows an error page."
        explanation: "Not correct. No error is shown."
    correct_option: a
    explanation: "Correct. Do not use `ignore()` for a mandatory step."
