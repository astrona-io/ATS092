# Register A Required Action
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-092-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the provider and Maven volumes and the tester pod, and creates the realm inventory"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-092-lab-020-02-setup"
      description: "Builds the accept-terms required action with a misnamed services file and creates the user bob"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-keycloak-ready"
      description: "Confirms the Keycloak Deployment has a ready pod"
      type: "file"
      source: "validation/validate-keycloak-ready.sh"
    - name: "validate-action-in-serverinfo"
      description: "Confirms serverinfo lists the provider accept-terms"
      type: "file"
      source: "validation/validate-action-in-serverinfo.sh"
    - name: "validate-action-registered"
      description: "Confirms the realm has the enabled required action accept-terms"
      type: "file"
      source: "validation/validate-action-registered.sh"
    - name: "validate-bob-has-action"
      description: "Confirms bob has the required action and alice does not"
      type: "file"
      source: "validation/validate-bob-has-action.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - maven:3.9.15-eclipse-temurin-21
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
